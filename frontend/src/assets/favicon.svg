<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#070d1a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9aa6b8"/>
      <stop offset="1" stop-color="#e6ebf2"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <!-- the signal head from the logo's iris, on its own -->
  <rect x="19.5" y="5.5" width="25" height="53" rx="8" fill="#05080f" stroke="url(#chrome)" stroke-width="2.6"/>
  <circle cx="32" cy="17" r="6.8" fill="#ff3b47"/>
  <circle cx="32" cy="32" r="6.8" fill="#ffb020"/>
  <circle cx="32" cy="47" r="6.8" fill="#2af28e"/>
</svg>
