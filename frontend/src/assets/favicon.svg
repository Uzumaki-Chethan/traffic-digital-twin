<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#070d1a"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b47"/>
      <stop offset="0.5" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#2af28e"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9aa6b8"/>
      <stop offset="1" stop-color="#e6ebf2"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <!-- the eye: an almond in the signal trail -->
  <path d="M4 32 Q32 5 60 32 Q32 59 4 32 Z" fill="none" stroke="url(#trail)" stroke-width="4" stroke-linejoin="round"/>
  <!-- the iris: a signal head -->
  <rect x="21.5" y="9.5" width="21" height="45" rx="6.5" fill="#05080f" stroke="url(#chrome)" stroke-width="2.4"/>
  <circle cx="32" cy="19" r="5.6" fill="#ff3b47"/>
  <circle cx="32" cy="32" r="5.6" fill="#ffb020"/>
  <circle cx="32" cy="45" r="5.6" fill="#2af28e"/>
</svg>
